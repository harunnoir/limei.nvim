name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua colors scripts tests
      - uses: MunifTanjim/setup-neovim-action@v1
        with:
          tag: stable
      - run: make test
      - run: nvim --clean --headless -u tests/minimal_init.lua -c "lua dofile('scripts/audit.lua')" -c "qa!"
